name: Flow

options:
  bundleIdPrefix: com.zjzbs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 固定生成 Xcode 15 兼容格式的工程文件。
  # 不写这行的话，XcodeGen 新版会生成 objectVersion 77（Xcode 16 格式），
  # 老版本 Xcode 打不开。
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: "iphoneos"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

targets:

  # ---------------- 主 App ----------------
  Flow:
    type: application
    platform: iOS
    sources:
      - path: Flow/App
      - path: Flow/Shared
      - path: Flow/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjzbs.flow
        PRODUCT_NAME: Flow
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Flow/Generated/AppInfo.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
    dependencies:
      - target: FlowWidget
        embed: true

  # ---------------- 桌面小组件 ----------------
  FlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Flow/Widget
      - path: Flow/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjzbs.flow.widget
        PRODUCT_NAME: FlowWidget
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    info:
      path: Flow/Generated/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Flow:
    build:
      targets:
        Flow: all
        FlowWidget: all
    run:
      config: Debug
    archive:
      config: Release
